<div class="swac_collage">

        <img class="swac_collage_mainimg" alt="">
        <div class="swac_collage_caption uk-text-meta"></div>
    </div>
    <div class="swac_collage_nav">
        <button class="uk-icon-button swac_collage_prev" uk-icon="chevron-double-left" uk-tooltip="Collage.prev"></button>
        <button class="uk-button uk-button-default uk-button-small swac_collage_jumpback"></button>

        <button class="uk-icon-button swac_collage_next" uk-icon="chevron-double-right" uk-tooltip="Collage.next"></button>

    <div class="swac_collage_msg uk-text-meta"></div>
