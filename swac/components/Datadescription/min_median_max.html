<h2 class="swac_datadescription_legendtitle" swac_lang="Datadescription.legendtitle"></h2>
<ul uk-accordion class="uk-accordion-default" animation="false" multiple="true" style="width: max-content">
    <li class="uk-open swac_repeatedForLegend swac_datadescription_empty_legend">
        <input class="uk-checkbox swac_datadescription_datacheck" type="checkbox" checked>
        <div class="swac_datadescription_wrapper_title">
            <input class="swac_datadescription_datatitle input_nostyle" value="Messwert" readonly style="width: 8ch;" />
            <input class="swac_datadescription_attribute_border_color" type="color" />
            <span class="swac_datadescription_attribute_delete" uk-icon="icon: trash; ratio: 1" uk-toggle="target: .swac_datadescription_delete_modal"></span>
        </div>
        <a class="uk-accordion-title"></a>
        <div class="swac_datadescription_wrapper_datadesc">
        <input class="swac_datadescription_datadesc input_nostyle" value="—" readonly style="width: 1ch;" />
        </div>
        <div class="swac_datadescription_wrapper_attribution uk-accordion-content">
            <div class="swac_datadescription_attribution">
                <div style="display: flex; margin-bottom: 10px;">
                    <input class="swac_datadescription_value_col" type="color" value="#00ff00" style="--color: #00ff00;" data-statistic="minValue" data-color="#00ff00" data-label="Minimum" />
                    <input class="input_nostyle swac_datadescription_value_txt" value="Minimum" readonly style="margin-left: 10px; width: 7ch;" />
                    <input class="input_nostyle swac_datadescription_value_value" placeholder="—" style="margin-left: 10px; width: 12ch;" readonly />
                    <span uk-icon="icon: trash; ratio: 1" class="swac_datadescription_removebutton"></span>
                </div>
                <div style="display: flex; margin-bottom: 10px;">
                    <input class="swac_datadescription_value_col" type="color" value="#ffff00" style="--color: #ffff00;" data-statistic="medianValue" data-color="#ffff00" data-label="Median" />
                    <input class="input_nostyle swac_datadescription_value_txt" value="Median" readonly style="margin-left: 10px; width: 6ch;" />
                    <input class="input_nostyle swac_datadescription_value_value" placeholder="—" style="margin-left: 10px; width: 12ch;" readonly />
                    <span uk-icon="icon: trash; ratio: 1" class="swac_datadescription_removebutton"></span>
                </div>
                <div style="display: flex; margin-bottom: 10px;">
                    <input class="swac_datadescription_value_col" type="color" value="#ff0000" style="--color: #ff0000;" data-statistic="maxValue" data-color="#ff0000" data-label="Maximum" />
                    <input class="input_nostyle swac_datadescription_value_txt" value="Maximum" readonly style="margin-left: 10px; width: 7ch;" />
                    <input class="input_nostyle swac_datadescription_value_value" placeholder="—" style="margin-left: 10px; width: 12ch;" readonly />
                    <span uk-icon="icon: trash; ratio: 1" class="swac_datadescription_removebutton"></span>
                </div>
            </div>
            <div class="swac_datadescription_wrapper_button">
                <button class="uk-button uk-button-small uk-button-default swac_datadescription_addbutton" type="button" disabled swac_lang="Datadescription.addButton"></button>
            </div>
        </div>
    </li>
    <li class="swac_repeatForLegend uk-open">
        <input class="uk-checkbox swac_datadescription_datacheck" type="checkbox">
        <div class="swac_datadescription_wrapper_title">
            <input class="swac_datadescription_datatitle input_nostyle" href="#" uk-tooltip="{txt_desc}" />
            <input class="swac_datadescription_attribute_border_color" type="color" />
            <span class="swac_datadescription_attribute_delete" uk-icon="icon: trash; ratio: 1" uk-toggle="target: .swac_datadescription_delete_modal"></span>
        </div>
        <a class="uk-accordion-title"></a>
        <div class="swac_datadescription_wrapper_datadesc">
        <input class="swac_datadescription_datadesc input_nostyle" value="{txt_desc}" />
        </div>
        <div class="swac_datadescription_wrapper_attribution uk-accordion-content">
            <div class="swac_datadescription_attribution"></div>
            <div class="swac_datadescription_wrapper_button">
                <button class="uk-button uk-button-small uk-button-default swac_datadescription_addbutton" type="button" swac_lang="Datadescription.addButton"></button>
            </div>
        </div>
    </li>
</ul>
<button hidden class="uk-button uk-bottom-small uk-button-default" type="button" uk-toggle="target: .swac_datadescription_modal" swac_lang="Datadescription.addNewAttribute"></button>

<div class="swac_datadescription_modal"uk-modal>
    <div class="uk-modal-dialog uk-modal-body">
        <h2 class="uk-modal-title" swac_lang="Datadescription.modal_title"></h2>
        <div class="uk-margin">
            <label class="uk-form-label" swac_lang="Datadescription.modal_attribute"></label>
            <input class="uk-input swac_datadescription_modal_attribute_name" type="text" />
        </div>
        <div style="margin-top: 10px; margin-bottom: 60px"> 
            <label class="uk-form-label" swac_lang="Datadescription.modal_border_color"></label>
            <input class="swac_datadescription_modal_border_col" type="color" style="--color: #000000" />
        </div>
        <div class="uk-margin">
            <label class="uk-form-label" swac_lang="Datadescription.modal_visualise"></label>    
            <input class="uk-checkbox swac_datadescription_modal_visualise" style="width: 20px; height: 20px" type="checkbox" checked />
        </div>
        <p class="uk-text-right">
            <input class="uk-button uk-button-default uk-modal-close" type="button" value="Datadescription.cancelButton" />
            <input class="uk-button uk-button-primary swac_datadescription_new_attribute_button" type="button" value="Datadescription.saveButton" />
        </p>
    </div>
</div>
